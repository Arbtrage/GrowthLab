name: Daily Editions

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Edition slot"
        required: true
        default: "am"
        type: choice
        options:
          - am
          - pm

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "slot=am" >> $GITHUB_OUTPUT
          else
            echo "slot=pm" >> $GITHUB_OUTPUT
          fi

      - name: Generate edition
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/generate?slot=${{ steps.slot.outputs.slot }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
